appId: ai.doppel.desktop
productName: doppel
copyright: Copyright © 2025 Doppel AI, Inc.

directories:
  output: release

files:
  - main.js
  - preload.js
  - preload.pill.js
  - preload.response.js
  - preload.quickask.js
  - preload.debate.js
  - preload.voicecall.js
  - assets/**
  - package.json
  - node_modules/**
  - dist/renderer/**

mac:
  icon: assets/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  darkModeSupport: true
  extraResources:
    - from: assets/bin/doppel-agent
      to: bin/doppel-agent

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: assets/bin/doppel-agent.exe
      to: bin/doppel-agent.exe

linux:
  icon: assets/icon.png
  target: AppImage
  category: Office
  extraResources:
    - from: assets/bin/doppel-agent
      to: bin/doppel-agent

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
