appId: ai.doppel.desktop
productName: doppel
copyright: Copyright © 2025 Doppel AI, Inc.

directories:
  output: release

files:
  - main.js
  - preload.js
  - assets/**
  - package.json
  - node_modules/**

mac:
  icon: assets/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  darkModeSupport: true

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

linux:
  icon: assets/icon.png
  target: AppImage
  category: Office
