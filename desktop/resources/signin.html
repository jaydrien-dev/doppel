<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;
             script-src * 'unsafe-inline' 'unsafe-eval';
             connect-src *;
             style-src * 'unsafe-inline';
             img-src * data: blob:;
             font-src * data:;
             frame-src *;" />
  <title>Sign in to doppel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #080808;
      color: rgba(255,255,255,0.85);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px 40px;
      position: relative;
    }
    /* Background — exact copy from website sign-in page */
    .bg-base {
      position: fixed; inset: 0; background: #080808; z-index: -1; pointer-events: none;
    }
    .bg-grid {
      position: fixed; inset: 0;
      background: #080808;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
      z-index: 0; pointer-events: none;
    }
    .bg-orb {
      position: fixed; top: 10%; left: 50%; transform: translateX(-50%);
      width: 560px; height: 560px; border-radius: 50%;
      background: rgba(167,139,250,0.07);
      filter: blur(120px); pointer-events: none; z-index: 0;
    }
    .content {
      position: relative; z-index: 1; width: 100%; max-width: 420px;
    }
    /* Brand — exact copy from website */
    .brand {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; margin-bottom: 32px;
    }
    .brand-name {
      font-size: 19px; font-weight: 500; color: rgba(255,255,255,0.88);
      letter-spacing: -0.02em;
    }
    .brand-sub {
      font-size: 13px; color: rgba(255,255,255,0.32); margin-top: 5px;
      letter-spacing: -0.01em;
    }
    /* Loading */
    .loading {
      display: flex; align-items: center; justify-content: center;
      padding: 48px 0; gap: 8px; color: rgba(255,255,255,0.35); font-size: 13px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: rgba(255,255,255,0.45);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Error */
    .error-box {
      background: rgba(248,113,113,0.06);
      border: 1px solid rgba(248,113,113,0.12);
      border-radius: 10px; padding: 12px 14px; margin-top: 12px;
      font-size: 12px; color: rgba(248,113,113,0.75); display: none;
      text-align: center;
    }
    .error-box.visible { display: block; }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg-base"></div>
    <div class="bg-grid"></div>
    <div class="bg-orb"></div>

    <div class="content">
      <!-- Brand — same as website sign-in page -->
      <div class="brand">
        <svg width="36" height="36" viewBox="0 0 22 22" fill="none" style="flex-shrink:0">
          <rect x="0.5" y="0.5" width="21" height="21" rx="6.5"
            fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)" />
          <circle cx="8.88" cy="8.88" r="4.65" fill="rgba(255,255,255,0.95)" />
          <circle cx="13.96" cy="13.96" r="3.80" fill="rgba(167,139,250,0.70)" />
        </svg>
        <div style="text-align:center">
          <p class="brand-name">doppel</p>
          <p class="brand-sub">Be in two places at once.</p>
        </div>
      </div>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        <span>Loading...</span>
      </div>

      <div id="sign-in"></div>
      <div id="error" class="error-box"></div>
    </div>
  </div>

  <!-- Clerk JS from FAPI CDN — auto-inits window.Clerk -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_ZWxlY3RyaWMtbW9yYXktNzMuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://electric-moray-73.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <script>
    window.addEventListener("load", async function () {
      var loadingEl = document.getElementById("loading");
      var errorEl = document.getElementById("error");

      function showError(msg) {
        loadingEl.style.display = "none";
        errorEl.textContent = msg;
        errorEl.classList.add("visible");
      }

      if (!window.Clerk) {
        showError("Could not load sign-in. Check your internet connection.");
        return;
      }

      try {
        var timeout = setTimeout(function () {
          showError("Sign-in is taking too long. Restart the app and try again.");
        }, 15000);

        await window.Clerk.load();

        clearTimeout(timeout);
        loadingEl.style.display = "none";

        // Mount SignIn — same appearance as the website's sign-in page
        window.Clerk.mountSignIn(document.getElementById("sign-in"), {
          appearance: {
            variables: {
              colorBackground: "rgba(255,255,255,0.04)",
              colorText: "rgba(255,255,255,0.82)",
              colorTextSecondary: "rgba(255,255,255,0.40)",
              colorInputBackground: "rgba(255,255,255,0.05)",
              colorInputText: "rgba(255,255,255,0.80)",
              borderRadius: "12px",
              fontFamily: "'Plus Jakarta Sans', system-ui, sans-serif",
            },
            elements: {
              rootBox: { width: "100%" },
              card: {
                backgroundColor: "rgba(255,255,255,0.04)",
                backdropFilter: "blur(24px)",
                WebkitBackdropFilter: "blur(24px)",
                border: "1px solid rgba(255,255,255,0.08)",
                borderRadius: "16px",
                boxShadow: "none",
              },
              headerTitle: { color: "rgba(255,255,255,0.85)", fontWeight: "500", fontSize: "15px" },
              headerSubtitle: { color: "rgba(255,255,255,0.38)", fontSize: "13px" },
              formFieldLabel: { color: "rgba(255,255,255,0.45)", fontSize: "12px", fontWeight: "400" },
              formFieldInput: {
                backgroundColor: "rgba(255,255,255,0.05)",
                borderColor: "rgba(255,255,255,0.08)",
                color: "rgba(255,255,255,0.80)",
                borderRadius: "12px",
              },
              formButtonPrimary: {
                backgroundColor: "rgba(255,255,255,0.10)",
                color: "rgba(255,255,255,0.85)",
                border: "1px solid rgba(255,255,255,0.10)",
                borderRadius: "12px",
                fontWeight: "500",
                boxShadow: "none",
              },
              footerActionLink: { color: "rgba(255,255,255,0.50)" },
              footerActionText: { color: "rgba(255,255,255,0.32)" },
              dividerLine: { backgroundColor: "rgba(255,255,255,0.07)" },
              dividerText: { color: "rgba(255,255,255,0.25)", fontSize: "12px" },
              socialButtonsBlockButton: {
                backgroundColor: "rgba(255,255,255,0.05)",
                border: "1px solid rgba(255,255,255,0.08)",
                borderRadius: "12px",
              },
              socialButtonsBlockButtonText: { color: "rgba(255,255,255,0.55)", fontWeight: "400", fontSize: "13px" },
              identityPreviewText: { color: "rgba(255,255,255,0.55)" },
              identityPreviewEditButton: { color: "rgba(255,255,255,0.38)" },
              formResendCodeLink: { color: "rgba(255,255,255,0.45)" },
              otpCodeFieldInput: {
                backgroundColor: "rgba(255,255,255,0.05)",
                borderColor: "rgba(255,255,255,0.08)",
                color: "rgba(255,255,255,0.80)",
                borderRadius: "12px",
              },
              alertText: { color: "rgba(255,255,255,0.55)", fontSize: "12px" },
              formFieldErrorText: { color: "rgba(248,113,113,0.70)", fontSize: "12px" },
              footer: { backgroundColor: "transparent" },
            },
          },
        });

        // When sign-in completes, encode user info in the window title.
        // The main process listens for page-title-updated and extracts it.
        window.Clerk.addListener(function (resources) {
          if (resources.user && resources.session) {
            document.title = "auth:" + JSON.stringify({
              userId: resources.user.id,
              firstName: resources.user.firstName || "",
              lastName: resources.user.lastName || "",
            });
          }
        });
      } catch (err) {
        showError("Could not initialize sign-in: " + (err.message || String(err)));
      }
    });
  </script>
</body>
</html>
