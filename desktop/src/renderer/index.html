<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>doppel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --bg:            #080808;
        --bg-elev-1:     rgba(255,255,255,0.04);
        --bg-elev-2:     rgba(255,255,255,0.07);
        --bg-elev-3:     rgba(255,255,255,0.11);
        --border:        rgba(255,255,255,0.06);
        --border-hover:  rgba(255,255,255,0.14);
        --fg-1:          rgba(255,255,255,0.85);
        --fg-2:          rgba(255,255,255,0.60);
        --fg-3:          rgba(255,255,255,0.40);
        --fg-4:          rgba(255,255,255,0.25);
        --blue:          #1A73E8;
        --blue-soft:     rgba(26,115,232,0.08);
        --blue-ring:     rgba(26,115,232,0.30);
        --ease:          cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      html, body, #root {
        height: 100%;
        background: var(--bg);
        color: var(--fg-1);
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
        color-scheme: dark;
        font-feature-settings: "ss01" on, "cv11" on;
      }

      ::-webkit-scrollbar        { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track  { background: transparent; }
      ::-webkit-scrollbar-thumb  { background: rgba(255,255,255,0.10); border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.20); }

      ::selection { background: rgba(26,115,232,0.25); color: rgba(255,255,255,0.95); }

      input, textarea {
        background: transparent;
        color: rgba(255,255,255,0.90);
        color-scheme: dark;
        font-family: inherit;
      }
      input::placeholder, textarea::placeholder { color: var(--fg-4); }

      @keyframes spin        { to { transform: rotate(360deg); } }
      @keyframes dot-bounce  { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-4px); } }
      @keyframes fade-up     { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
      @keyframes blink       { 0%,100% { opacity:1; } 50% { opacity:0; } }

      /* Brand mark — dual circle icon */
      .brand-mark {
        width: 24px; height: 24px; border-radius: 7px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.12);
        position: relative; flex-shrink: 0;
      }
      .brand-mark::before, .brand-mark::after {
        content: ""; position: absolute; border-radius: 999px;
      }
      .brand-mark::before {
        width: 10px; height: 10px; left: 4px; top: 4px;
        background: rgba(255,255,255,0.95);
      }
      .brand-mark::after {
        width: 8px; height: 8px; left: 11px; top: 11px;
        background: rgba(255,255,255,0.50);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
