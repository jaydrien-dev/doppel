<!DOCTYPE html>
<html lang="en" class="doppel-light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Doppel — Marketplace UI kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css"/>
  <link rel="stylesheet" href="marketplace.css"/>
  <style>
    /* Tab bar for navigating between screens within the kit */
    .kit-tabs {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 100;
      background: rgba(8,8,8,0.9); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 999px;
      padding: 4px;
      display: flex; gap: 2px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.24);
    }
    .kit-tab {
      background: transparent; border: none;
      padding: 7px 14px; border-radius: 999px;
      font-family: var(--font-sans); font-size: 12px; font-weight: 500;
      color: rgba(255,255,255,0.5); cursor: pointer;
      transition: all 180ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .kit-tab:hover { color: rgba(255,255,255,0.8); }
    .kit-tab--active {
      background: rgba(255,255,255,0.11);
      color: rgba(255,255,255,0.95);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="BrowseScreen.jsx"></script>
  <script type="text/babel" src="DetailScreen.jsx"></script>
  <script type="text/babel" src="SynthesisScreen.jsx"></script>
  <script type="text/babel" src="ChatScreen.jsx"></script>
  <script type="text/babel" src="BundleScreen.jsx"></script>

  <script type="text/babel">
    const { useState: useStateApp } = React;

    function App() {
      // Persist screen in URL hash so reload returns you to the same view
      const initial = (window.location.hash || '#browse').replace('#', '') || 'browse';
      const [screen, setScreen]     = useStateApp(initial);
      const [activeClone, setClone] = useStateApp(CLONES[0]);
      const [search, setSearch]     = useStateApp('');
      const [category, setCategory] = useStateApp('');

      function navigate(name, payload) {
        if (payload) setClone(payload);
        setScreen(name);
        window.location.hash = name;
      }
      window.app = { navigate };

      const isDark = screen === 'chat';
      React.useEffect(() => {
        document.documentElement.classList.toggle('doppel-light', !isDark);
        document.body.style.background = isDark ? '#080808' : 'var(--bg-light)';
      }, [isDark]);

      return (
        <>
          {screen === 'browse'    && <BrowseScreen search={search} setSearch={setSearch} category={category} setCategory={setCategory} onOpen={(c) => navigate('detail', c)}/>}
          {screen === 'detail'    && <DetailScreen clone={activeClone} onBack={() => navigate('browse')} onChat={(c) => navigate('chat', c)}/>}
          {screen === 'synthesis' && <SynthesisScreen onNav={navigate}/>}
          {screen === 'chat'      && <ChatScreen clone={activeClone} onBack={() => navigate('detail', activeClone)}/>}
          {screen === 'bundle'    && <BundleScreen onNav={navigate}/>}

          {/* Kit nav */}
          <div className="kit-tabs">
            {[
              ['browse',    'Marketplace'],
              ['detail',    'Clone detail'],
              ['synthesis', 'Synthesis'],
              ['bundle',    'Bundle'],
              ['chat',      'Chat (dark)'],
            ].map(([id, label]) => (
              <button key={id}
                      className={`kit-tab ${screen === id ? 'kit-tab--active' : ''}`}
                      onClick={() => navigate(id)}>{label}</button>
            ))}
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
