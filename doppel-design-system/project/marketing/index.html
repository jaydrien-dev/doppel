<!doctype html>
<html lang="en" class="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doppel — knowledge that outlasts you</title>

  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sections.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react" src="primitives.jsx"></script>
  <script type="text/babel" data-presets="react" src="hero.jsx"></script>
  <script type="text/babel" data-presets="react" src="sections.jsx"></script>
  <script type="text/babel" data-presets="react" src="contact.jsx"></script>

  <script type="text/babel" data-presets="react">
    function App() {
      const [route, setRoute] = useState(() => (window.location.hash === "#contact" ? "contact" : "home"));
      useEffect(() => {
        const onHash = () => setRoute(window.location.hash === "#contact" ? "contact" : "home");
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);
      const go = (r) => {
        window.location.hash = r === "contact" ? "#contact" : "";
        window.scrollTo({ top: 0, behavior: "instant" });
      };

      if (route === "contact") {
        return <ContactPage onHome={() => go("home")} />;
      }

      return (
        <div data-screen-label="Landing">
          <Nav onContact={() => go("contact")} />
          <Hero onContact={() => go("contact")} />
          <Ticker />
          <DemoSection />
          <CardStack />
          <StatsSection />
          <PricingSection onContact={() => go("contact")} />
          <FinalCTA onContact={() => go("contact")} />
          <Foot onContact={() => go("contact")} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
