<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>
<div style="display:grid; grid-template-columns: 1fr 1fr;">
  <div style="background:#fff; padding:28px 24px; display:flex; flex-direction:column; gap:18px; align-items:flex-start;">
    <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#5F6368;">Light surface</div>
    <!-- Lockup -->
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:28px; height:28px; border-radius:8px; background:#1A73E8; position:relative;">
        <div style="position:absolute; left:6px; top:6px; width:11px; height:11px; border-radius:999px; background:rgba(255,255,255,0.95);"></div>
        <div style="position:absolute; left:13px; top:12px; width:9px; height:9px; border-radius:999px; background:rgba(255,255,255,0.55);"></div>
      </div>
      <div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-size:22px; font-weight:600; letter-spacing:-0.02em; color:#1D1D1F;"><span style="color:#1A73E8;">d</span>oppel</div>
    </div>
    <!-- Wordmark -->
    <div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-size:22px; font-weight:600; letter-spacing:-0.02em; color:#1D1D1F;"><span style="color:#1A73E8;">d</span>oppel</div>
    <!-- Mark -->
    <div style="width:36px; height:36px; border-radius:10px; background:#1A73E8; position:relative;">
      <div style="position:absolute; left:8px; top:8px; width:14px; height:14px; border-radius:999px; background:rgba(255,255,255,0.95);"></div>
      <div style="position:absolute; left:17px; top:16px; width:11px; height:11px; border-radius:999px; background:rgba(255,255,255,0.55);"></div>
    </div>
  </div>
  <div style="background:#080808; padding:28px 24px; display:flex; flex-direction:column; gap:18px; align-items:flex-start;">
    <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.4);">Dark surface</div>
    <!-- Lockup dark -->
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:28px; height:28px; border-radius:8px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); position:relative;">
        <div style="position:absolute; left:6px; top:6px; width:11px; height:11px; border-radius:999px; background:rgba(255,255,255,0.95);"></div>
        <div style="position:absolute; left:13px; top:12px; width:9px; height:9px; border-radius:999px; background:rgba(255,255,255,0.55);"></div>
      </div>
      <div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-size:22px; font-weight:600; letter-spacing:-0.02em; color:rgba(255,255,255,0.85);"><span style="color:#1A73E8;">d</span>oppel</div>
    </div>
    <!-- Wordmark dark -->
    <div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-size:22px; font-weight:600; letter-spacing:-0.02em; color:rgba(255,255,255,0.85);">doppel</div>
    <!-- Mark dark -->
    <div style="width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); position:relative;">
      <div style="position:absolute; left:8px; top:8px; width:14px; height:14px; border-radius:999px; background:rgba(255,255,255,0.95);"></div>
      <div style="position:absolute; left:17px; top:16px; width:11px; height:11px; border-radius:999px; background:rgba(255,255,255,0.55);"></div>
    </div>
  </div>
</div></body>
</html>
