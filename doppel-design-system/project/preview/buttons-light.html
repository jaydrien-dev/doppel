<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>
<div style="background:#F8F9FA; padding:24px;">
  <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#5F6368; margin-bottom:16px;">Buttons · light surface</div>
  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <button style="background:#1A73E8; border:none; color:#fff; padding:10px 18px; border-radius:12px; font-family:inherit; font-size:13px; font-weight:500; box-shadow:0 4px 14px rgba(26,115,232,0.25); display:inline-flex; align-items:center; gap:8px;">
      Sign up
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button style="background:#F1F3F4; border:none; color:#5F6368; padding:10px 18px; border-radius:12px; font-family:inherit; font-size:13px; font-weight:500;">
      Cancel
    </button>
    <button style="background:#fff; border:1px solid rgba(0,0,0,0.10); color:#5F6368; padding:10px 18px; border-radius:12px; font-family:inherit; font-size:13px; font-weight:500;">
      Buy credits
    </button>
    <button style="background:transparent; border:none; color:#1A73E8; padding:10px 14px; font-family:inherit; font-size:13px; font-weight:500;">
      Sell your knowledge
    </button>
  </div>
  <div style="margin-top:18px; display:flex; gap:10px; align-items:center;">
    <button style="background:#1A73E8; opacity:0.4; cursor:not-allowed; color:#fff; padding:10px 18px; border:none; border-radius:12px; font-family:inherit; font-size:13px; font-weight:500;">
      Disabled
    </button>
    <button style="background:#fff; border:1px solid rgba(0,0,0,0.10); color:#9CA3AF; padding:10px 18px; border-radius:12px; font-family:inherit; font-size:13px; font-weight:500; display:inline-flex; gap:8px; align-items:center;">
      <span style="width:12px; height:12px; border:1.5px solid rgba(0,0,0,0.1); border-top-color:#1A73E8; border-radius:999px; display:inline-block;"></span>
      Loading…
    </button>
    <span style="font-size:11px; color:#9CA3AF; margin-left:6px;">Primary uses brand shadow · Hover drops opacity to 0.90</span>
  </div>
</div></body>
</html>
