<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>
<div style="background:#F8F9FA; padding:22px;">
  <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#5F6368; margin-bottom:14px;">Badges & status</div>
  <div style="display:flex; flex-direction:column; gap:14px;">
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <span style="font-size:10px; color:#9CA3AF; width:80px;">Positive</span>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:rgba(52,211,153,0.10); color:#10B981;"><span style="width:6px; height:6px; border-radius:999px; background:#34D399;"></span>Knowledge preserved</span>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:rgba(52,211,153,0.10); color:#10B981;">92% confident</span>
      <span style="display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:#fff; color:#0D9488; border:1px solid rgba(13,148,136,0.2);"><svg width="9" height="9" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Verified</span>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <span style="font-size:10px; color:#9CA3AF; width:80px;">Negative</span>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:rgba(248,113,113,0.10); color:#EF4444;"><span style="width:6px; height:6px; border-radius:999px; background:#F87171;"></span>Gone on their last day</span>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:rgba(248,113,113,0.10); color:#EF4444;">Rejected</span>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <span style="font-size:10px; color:#9CA3AF; width:80px;">Enterprise</span>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:rgba(167,139,250,0.10); color:#8B5CF6;">Enterprise Pro</span>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:rgba(167,139,250,0.10); color:#8B5CF6;">Max</span>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <span style="font-size:10px; color:#9CA3AF; width:80px;">Warning</span>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:rgba(251,191,36,0.10); color:#D97706;">Escalated</span>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:rgba(251,191,36,0.10); color:#D97706;">Pending review</span>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <span style="font-size:10px; color:#9CA3AF; width:80px;">Neutral</span>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:#F1F3F4; color:#5F6368;">Personal</span>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500; padding:4px 10px; border-radius:999px; background:rgba(26,115,232,0.08); color:#1A73E8;">Free</span>
    </div>
  </div>
</div></body>
</html>
