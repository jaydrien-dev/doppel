<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>
<div style="background:#fff; padding:24px;">
  <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#5F6368; margin-bottom:16px;">Spacing · 4-pt grid</div>
  <div style="display:flex; flex-direction:column; gap:8px;">
    
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="width:42px; font-size:11px; color:#5F6368; font-family:ui-monospace,Menlo,monospace; text-align:right;">4px</span>
        <div style="height:10px; width:16px; background:#1A73E8; border-radius:3px; opacity:0.85;"></div>
        <span style="font-size:11px; color:#9CA3AF;">icon gap</span>
      </div>
    
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="width:42px; font-size:11px; color:#5F6368; font-family:ui-monospace,Menlo,monospace; text-align:right;">8px</span>
        <div style="height:10px; width:32px; background:#1A73E8; border-radius:3px; opacity:0.85;"></div>
        <span style="font-size:11px; color:#9CA3AF;">tight stack</span>
      </div>
    
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="width:42px; font-size:11px; color:#5F6368; font-family:ui-monospace,Menlo,monospace; text-align:right;">12px</span>
        <div style="height:10px; width:48px; background:#1A73E8; border-radius:3px; opacity:0.85;"></div>
        <span style="font-size:11px; color:#9CA3AF;">chip pad</span>
      </div>
    
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="width:42px; font-size:11px; color:#5F6368; font-family:ui-monospace,Menlo,monospace; text-align:right;">16px</span>
        <div style="height:10px; width:64px; background:#1A73E8; border-radius:3px; opacity:0.85;"></div>
        <span style="font-size:11px; color:#9CA3AF;">card stack</span>
      </div>
    
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="width:42px; font-size:11px; color:#5F6368; font-family:ui-monospace,Menlo,monospace; text-align:right;">20px</span>
        <div style="height:10px; width:80px; background:#1A73E8; border-radius:3px; opacity:0.85;"></div>
        <span style="font-size:11px; color:#9CA3AF;">card pad sm</span>
      </div>
    
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="width:42px; font-size:11px; color:#5F6368; font-family:ui-monospace,Menlo,monospace; text-align:right;">24px</span>
        <div style="height:10px; width:96px; background:#1A73E8; border-radius:3px; opacity:0.85;"></div>
        <span style="font-size:11px; color:#9CA3AF;">card pad</span>
      </div>
    
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="width:42px; font-size:11px; color:#5F6368; font-family:ui-monospace,Menlo,monospace; text-align:right;">32px</span>
        <div style="height:10px; width:128px; background:#1A73E8; border-radius:3px; opacity:0.85;"></div>
        <span style="font-size:11px; color:#9CA3AF;">page pad</span>
      </div>
    
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="width:42px; font-size:11px; color:#5F6368; font-family:ui-monospace,Menlo,monospace; text-align:right;">40px</span>
        <div style="height:10px; width:160px; background:#1A73E8; border-radius:3px; opacity:0.85;"></div>
        <span style="font-size:11px; color:#9CA3AF;">section break sm</span>
      </div>
    
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="width:42px; font-size:11px; color:#5F6368; font-family:ui-monospace,Menlo,monospace; text-align:right;">48px</span>
        <div style="height:10px; width:192px; background:#1A73E8; border-radius:3px; opacity:0.85;"></div>
        <span style="font-size:11px; color:#9CA3AF;">between sections</span>
      </div>
    
      <div style="display:flex; align-items:center; gap:14px;">
        <span style="width:42px; font-size:11px; color:#5F6368; font-family:ui-monospace,Menlo,monospace; text-align:right;">64px</span>
        <div style="height:10px; width:256px; background:#1A73E8; border-radius:3px; opacity:0.85;"></div>
        <span style="font-size:11px; color:#9CA3AF;">major sections</span>
      </div>
    
  </div>
</div></body>
</html>
