<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>
<div style="display:grid; grid-template-columns: 1fr 1fr;">
  <div style="background:#F8F9FA; padding:22px;">
    <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#5F6368; margin-bottom:12px;">Light inputs</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div style="position:relative;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#9CA3AF;"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input placeholder="Search knowledge clones…" style="width:100%; background:#F1F3F4; border:1.5px solid transparent; border-radius:12px; padding:9px 12px 9px 34px; font-family:inherit; font-size:13px; color:#1D1D1F; outline:none;"/>
      </div>
      <div style="position:relative;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#1A73E8;"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input value="business strategy" style="width:100%; background:#fff; border:1.5px solid #1A73E8; border-radius:12px; padding:9px 12px 9px 34px; font-family:inherit; font-size:13px; color:#1D1D1F; outline:none;"/>
      </div>
      <textarea placeholder="Share your experience…" rows="2" style="width:100%; background:#fff; border:1.5px solid rgba(0,0,0,0.08); border-radius:12px; padding:10px 12px; font-family:inherit; font-size:13px; color:#1D1D1F; outline:none; resize:none;"></textarea>
    </div>
  </div>
  <div style="background:#080808; padding:22px;">
    <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:12px;">Dark inputs</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div style="background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:10px;">
        <span style="flex:1; color:rgba(255,255,255,0.25); font-size:13px;">Ask Sarah anything…</span>
        <span style="width:24px; height:24px; border-radius:8px; background:rgba(255,255,255,0.07); display:inline-flex; align-items:center; justify-content:center;">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M5 11L11 5M5 5h6v6" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
      <div style="background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:10px 14px; font-size:13px; color:rgba(255,255,255,0.85);">Series A in this market</div>
      <textarea placeholder="Topic for deliberation…" rows="2" style="width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:10px 12px; font-family:inherit; font-size:13px; color:rgba(255,255,255,0.85); outline:none; resize:none;"></textarea>
    </div>
  </div>
</div></body>
</html>
