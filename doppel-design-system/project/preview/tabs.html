<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>
<div style="background:#080808; padding:22px;">
  <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:14px;">Segmented control · pill toggle</div>
  <div style="display:flex; gap:18px; align-items:center;">
    <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:999px; padding:4px; display:inline-flex; gap:4px;">
      <button style="background:rgba(255,255,255,0.07); border:none; color:rgba(255,255,255,0.85); padding:6px 18px; border-radius:999px; font-family:inherit; font-size:12px; font-weight:500;">Monthly</button>
      <button style="background:transparent; border:none; color:rgba(255,255,255,0.4); padding:6px 18px; border-radius:999px; font-family:inherit; font-size:12px; font-weight:500; display:inline-flex; gap:6px; align-items:center;">Yearly <span style="font-size:9px; color:rgba(255,255,255,0.3);">2 months free</span></button>
    </div>
    <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:4px; display:inline-flex; gap:4px;">
      <button style="background:rgba(255,255,255,0.07); border:none; color:rgba(255,255,255,0.85); padding:6px 14px; border-radius:8px; font-family:inherit; font-size:12px; font-weight:500;">For individuals</button>
      <button style="background:transparent; border:none; color:rgba(255,255,255,0.3); padding:6px 14px; border-radius:8px; font-family:inherit; font-size:12px; font-weight:500;">For teams</button>
    </div>
  </div>
  <p style="margin-top:14px; font-size:11px; color:rgba(255,255,255,0.4);">Pill-style toggle on light hero (rounded-full) · panel-style on dark (rounded-xl)</p>
</div></body>
</html>
