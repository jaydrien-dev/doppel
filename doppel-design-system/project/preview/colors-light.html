<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>

<div style="background:#F8F9FA; padding:24px;">

    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Page bg</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">#F8F9FA</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:#FFFFFF; border:1px solid rgba(0,0,0,0.08); border-radius:12px;"></div>

      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Card</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">#FFFFFF</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">

      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Muted (input bg)</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">#F1F3F4</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:rgba(0,0,0,0.08);  border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Border</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">rgba 0 / 0.08</div>
    </div>
  </div>
  </div>
  <div style="margin-top:16px; display:grid; grid-template-columns: repeat(4, 1fr); gap:14px;">

    <div style="width:100%; height:86px; background:#1D1D1F;  border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:rgba(255,255,255,0.85);">fg-1 primary</div>
      <div style="font-size:11px; color:rgba(255,255,255,0.4); font-family:ui-monospace, Menlo, monospace;">#1D1D1F</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:#5F6368;  border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:rgba(255,255,255,0.85);">fg-2 secondary</div>

    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:#C7CACD;  border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:rgba(255,255,255,0.85);">fg-4 placeholder</div>
      <div style="font-size:11px; color:rgba(255,255,255,0.4); font-family:ui-monospace, Menlo, monospace;">#C7CACD</div>
