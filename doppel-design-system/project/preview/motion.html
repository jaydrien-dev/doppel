<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>
<div style="background:#080808; padding:24px;">
  <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:16px;">Motion — one easing curve</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
    <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:16px;">
      <div style="font-size:13px; font-weight:500; color:rgba(255,255,255,0.85); margin-bottom:6px;">iOS ease (default)</div>
      <div style="font-family:ui-monospace,Menlo,monospace; font-size:11px; color:rgba(255,255,255,0.6); margin-bottom:10px;">cubic-bezier(0.25, 0.46, 0.45, 0.94)</div>
      <div style="font-size:11px; color:rgba(255,255,255,0.4);">Every product UI transition.</div>
    </div>
    <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:16px;">
      <div style="font-size:13px; font-weight:500; color:rgba(255,255,255,0.85); margin-bottom:6px;">Spring (marketing only)</div>
      <div style="font-family:ui-monospace,Menlo,monospace; font-size:11px; color:rgba(255,255,255,0.6); margin-bottom:10px;">cubic-bezier(0.34, 1.56, 0.64, 1)</div>
      <div style="font-size:11px; color:rgba(255,255,255,0.4);">Landing hero rotator only. Never in product.</div>
    </div>
  </div>
  <div style="margin-top:14px; display:flex; gap:14px; font-size:11px; color:rgba(255,255,255,0.6);">
    <span><span style="color:rgba(255,255,255,0.4);">Fast</span> 180ms</span><span style="color:rgba(255,255,255,0.2);">·</span>
    <span><span style="color:rgba(255,255,255,0.4);">Base</span> 280ms</span><span style="color:rgba(255,255,255,0.2);">·</span>
    <span><span style="color:rgba(255,255,255,0.4);">Slow</span> 420ms</span>
  </div>
</div></body>
</html>
