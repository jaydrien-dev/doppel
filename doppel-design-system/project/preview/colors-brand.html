<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>

<div style="background:#fff; padding:24px;">
  <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#5F6368; margin-bottom:16px;">Brand · Doppel blue</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:14px;">
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:#1A73E8;  border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Doppel blue</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">#1A73E8</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:#1765C9;  border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Hover</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">#1765C9</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:rgba(26,115,232,0.08); border:1px solid rgba(0,0,0,0.06); border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Soft</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">rgba blue / 0.08</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:rgba(26,115,232,0.30);  border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Ring</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">rgba blue / 0.30</div>
    </div>
  </div>
  </div>
  <p style="margin-top:14px; font-size:11px; color:#9CA3AF;">One accent for the entire system. Used flat — never as a gradient.</p>
</div>
</body>
</html>
