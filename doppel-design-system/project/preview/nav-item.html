<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>
<div style="background:#fff; padding:22px;">
  <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#5F6368; margin-bottom:14px;">Sidebar nav item — light (creator dashboard)</div>
  <div style="background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:16px; padding:12px; width:220px; display:flex; flex-direction:column; gap:2px;">
    <div style="padding:4px 12px 6px; font-size:10px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#1A73E8;">Clone</div>
    <!-- Active -->
    <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px; background:#1A73E8; color:#fff; box-shadow:0 2px 8px rgba(26,115,232,0.2); font-size:13px; font-weight:500;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.5" fill="currentColor" opacity="0.9"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.5" fill="currentColor" opacity="0.5"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.5" fill="currentColor" opacity="0.5"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.5" fill="currentColor" opacity="0.3"/></svg>
      Overview
    </div>
    <!-- Resting -->
    <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px; color:#5F6368; font-size:13px; font-weight:500;">
      <span style="color:#9CA3AF;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4" opacity="0.5"/></svg></span>
      Train
    </div>
    <!-- Hover -->
    <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px; background:#F1F3F4; color:#1D1D1F; font-size:13px; font-weight:500;">
      <span style="color:#5F6368;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.2" fill="currentColor" opacity="0.9"/><circle cx="3" cy="4.5" r="1.5" fill="currentColor" opacity="0.4"/><circle cx="13" cy="4.5" r="1.5" fill="currentColor" opacity="0.4"/><circle cx="3" cy="11.5" r="1.5" fill="currentColor" opacity="0.4"/><circle cx="13" cy="11.5" r="1.5" fill="currentColor" opacity="0.4"/></svg></span>
      Brain
    </div>
    <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px; color:#5F6368; font-size:13px; font-weight:500;">
      <span style="color:#9CA3AF;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5 13.5L7 9.5M9 9.5L11 13.5M4 5H12L10 9.5H6L4 5Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/></svg></span>
      Test
    </div>
  </div>
  <p style="margin-top:12px; font-size:11px; color:#9CA3AF;">Active fills with the group color · resting · hover (muted bg)</p>
</div></body>
</html>
