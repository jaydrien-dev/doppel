<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>
<div style="background:#080808; padding:24px;">
  <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:16px;">Buttons · dark surface</div>
  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <!-- Primary: glass-hi -->
    <button style="background:rgba(255,255,255,0.11); border:1px solid rgba(255,255,255,0.13); color:rgba(255,255,255,0.92); padding:10px 18px; border-radius:12px; font-family:inherit; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:8px; backdrop-filter:blur(20px);">
      Start free
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <!-- Secondary: glass-md -->
    <button style="background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.7); padding:10px 18px; border-radius:12px; font-family:inherit; font-size:13px; font-weight:500;">
      Request a demo
    </button>
    <!-- Tertiary: ghost / text -->
    <button style="background:transparent; border:none; color:rgba(255,255,255,0.5); padding:10px 14px; font-family:inherit; font-size:13px; font-weight:500;">
      Sign in
    </button>
    <!-- Icon button -->
    <button style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.6); width:36px; height:36px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center;">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M8 3L3 8M8 3l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div style="margin-top:18px; display:flex; gap:10px; align-items:center;">
    <!-- Disabled -->
    <button style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.25); padding:10px 18px; border-radius:12px; font-family:inherit; font-size:13px; font-weight:500; cursor:not-allowed;">
      Disabled
    </button>
    <!-- Loading -->
    <button style="background:rgba(255,255,255,0.11); border:1px solid rgba(255,255,255,0.13); color:rgba(255,255,255,0.92); padding:10px 18px; border-radius:12px; font-family:inherit; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:8px;">
      <span style="width:12px; height:12px; border:1.5px solid rgba(255,255,255,0.3); border-top-color:rgba(255,255,255,0.85); border-radius:999px; display:inline-block;"></span>
      Querying…
    </button>
    <span style="font-size:11px; color:rgba(255,255,255,0.4); margin-left:6px;">Primary uses glass-hi · Hover lifts overlay opacity, no scale</span>
  </div>
</div></body>
</html>
