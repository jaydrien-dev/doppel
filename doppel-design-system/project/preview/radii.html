<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>
<div style="background:#fff; padding:24px;">
  <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#5F6368; margin-bottom:16px;">Border radius — strict scale</div>
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:14px;">
    
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div style="height:78px; background:#F8F9FA; border:1px solid rgba(0,0,0,0.08); border-radius:6px;"></div>
        <div style="font-size:12px; font-weight:500; color:#1D1D1F;">sm · 6</div>
        <div style="font-size:11px; color:#9CA3AF;">tiny chips</div>
      </div>
    
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div style="height:78px; background:#F8F9FA; border:1px solid rgba(0,0,0,0.08); border-radius:8px;"></div>
        <div style="font-size:12px; font-weight:500; color:#1D1D1F;">md · 8</div>
        <div style="font-size:11px; color:#9CA3AF;">small badges</div>
      </div>
    
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div style="height:78px; background:#F8F9FA; border:1px solid rgba(0,0,0,0.08); border-radius:12px;"></div>
        <div style="font-size:12px; font-weight:500; color:#1D1D1F;">xl · 12</div>
        <div style="font-size:11px; color:#9CA3AF;">inputs, buttons</div>
      </div>
    
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div style="height:78px; background:#F8F9FA; border:1px solid rgba(0,0,0,0.08); border-radius:16px;"></div>
        <div style="font-size:12px; font-weight:500; color:#1D1D1F;">2xl · 16</div>
        <div style="font-size:11px; color:#9CA3AF;">cards, panels</div>
      </div>
    
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div style="height:78px; background:#F8F9FA; border:1px solid rgba(0,0,0,0.08); border-radius:9999px;"></div>
        <div style="font-size:12px; font-weight:500; color:#1D1D1F;">full · 999</div>
        <div style="font-size:11px; color:#9CA3AF;">pills, avatars</div>
      </div>
    
  </div>
  <p style="margin-top:14px; font-size:11px; color:#9CA3AF;">Cards <code style="font-family:ui-monospace,Menlo,monospace;">rounded-2xl</code>. Inputs/buttons <code style="font-family:ui-monospace,Menlo,monospace;">rounded-xl</code>. Nothing else.</p>
</div></body>
</html>
