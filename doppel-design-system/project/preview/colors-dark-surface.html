<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>

<div style="background:#080808; padding:24px;">
  <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:16px;">Dark surface · #080808</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:14px;">
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:#080808; border:1px solid rgba(255,255,255,0.06); border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:rgba(255,255,255,0.85);">Base</div>
      <div style="font-size:11px; color:rgba(255,255,255,0.4); font-family:ui-monospace, Menlo, monospace;">#080808</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:rgba(255,255,255,0.85);">Glass / elev-1</div>
      <div style="font-size:11px; color:rgba(255,255,255,0.4); font-family:ui-monospace, Menlo, monospace;">white / 0.04</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.06); border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:rgba(255,255,255,0.85);">Glass-md / elev-2</div>
      <div style="font-size:11px; color:rgba(255,255,255,0.4); font-family:ui-monospace, Menlo, monospace;">white / 0.07</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:rgba(255,255,255,0.11); border:1px solid rgba(255,255,255,0.12); border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:rgba(255,255,255,0.85);">Glass-hi / elev-3</div>
      <div style="font-size:11px; color:rgba(255,255,255,0.4); font-family:ui-monospace, Menlo, monospace;">white / 0.11</div>
    </div>
  </div>
  </div>
  <p style="margin-top:14px; font-size:11px; color:rgba(255,255,255,0.4);">Depth = blur + border + overlay opacity. No shadows on dark.</p>
</div>
</body>
</html>
