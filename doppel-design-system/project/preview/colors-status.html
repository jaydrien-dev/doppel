<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_base.css"/>
<style>html, body { width: 700px; margin:0; padding:0; }</style>
</head>
<body>

<div style="background:#fff; padding:24px;">
  <div style="font-size:10px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:#5F6368; margin-bottom:16px;">Status — used SPARINGLY, only for these semantics</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:14px;">
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:#34D399;  border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Emerald · positive</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">#34D399</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:#F87171;  border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Red · destructive</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">#F87171</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:#A78BFA;  border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Violet · enterprise</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">#A78BFA</div>
    </div>
  </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="width:100%; height:86px; background:#FBBF24;  border-radius:12px;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <div style="font-size:12px; font-weight:500; color:#1D1D1F;">Amber · warning</div>
      <div style="font-size:11px; color:#9CA3AF; font-family:ui-monospace, Menlo, monospace;">#FBBF24</div>
    </div>
  </div>
  </div>
  <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
    <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:4px 10px; border-radius:999px; background:rgba(52,211,153,0.10); color:#10B981;"><span style="width:6px; height:6px; border-radius:999px; background:#34D399;"></span>Knowledge preserved</span>
    <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:4px 10px; border-radius:999px; background:rgba(248,113,113,0.10); color:#EF4444;"><span style="width:6px; height:6px; border-radius:999px; background:#F87171;"></span>Gone on their last day</span>
    <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:4px 10px; border-radius:999px; background:rgba(167,139,250,0.10); color:#8B5CF6;">Enterprise</span>
    <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:4px 10px; border-radius:999px; background:rgba(251,191,36,0.10); color:#D97706;">Escalated</span>
  </div>
</div>
</body>
</html>
